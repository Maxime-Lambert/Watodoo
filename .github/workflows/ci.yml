name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test (unitaire + intégration + fonctionnel + architecture)
        run: dotnet test --no-build

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format (Prettier)
        run: pnpm format:check

      - name: Unitaire (Vitest)
        run: pnpm test

      - name: Installer Playwright + navigateurs
        run: pnpm exec playwright install --with-deps chromium

      - name: Interface (Playwright)
        run: pnpm test:e2e

  deploy:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Synchroniser le code sur le VPS
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          TARGET: /opt/watodoo/
          EXCLUDE: ".git/, node_modules/, bin/, obj/, frontend/dist/, frontend/test-results/"
          ARGS: "-az --delete"

      - name: Écrire le .env de prod et déployer
        uses: appleboy/ssh-action@v1
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          DOMAIN: ${{ vars.DOMAIN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: POSTGRES_PASSWORD,JWT_SIGNING_KEY,DOMAIN
          script: |
            set -euo pipefail
            cd /opt/watodoo
            cat > .env <<ENVEOF
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            JWT_SIGNING_KEY=$JWT_SIGNING_KEY
            DOMAIN=$DOMAIN
            ENVEOF
            chmod 600 .env
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -sf "https://${{ vars.DOMAIN }}/api/health"; then
              echo "Déploiement OK"
              exit 0
            fi
            echo "Tentative $i/10 échouée, retry dans 5s..."
            sleep 5
          done
          echo "Smoke test échoué après 10 tentatives"
          exit 1
